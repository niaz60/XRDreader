[build-system]
requires = ["setuptools>=62.0", "setuptools-git-versioning>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffai.xrdreader"
dynamic=['version', 'dependencies']
authors = [
  {name='Afnan Mostafa', email='amostafa@ur.rochester.edu'},
  {name='Simon J. L. Billinge', email='sbillinge@ucsb.edu'},
  {name='Niaz Abdolrahim', email='niaz@rochester.edu'},
  {name='William Ratcliff', email='wratclif@umd.edu'},
]
maintainers = [
  {name='Afnan Mostafa', email='amostafa@ur.rochester.edu'},
  {name='Simon J. L. Billinge', email='sbillinge@ucsb.edu'},
  {name='Niaz Abdolrahim', email='niaz@rochester.edu'},
  {name='William Ratcliff', email='wratclif@umd.edu'},
]
description = "Multi-step agentic framework for extracting powder diffraction patterns and associated metadata from published literature"
keywords = ['XRD', 'X-ray diffraction', 'crystallography', 'materials science', 'literature mining', 'LLM']
readme = "README.rst"
requires-python = ">=3.12, <3.15"
classifiers = [
        'Development Status :: 4 - Beta',
        'Environment :: X11 Applications :: Qt',
        'Intended Audience :: Developers',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: BSD License',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: Unix',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Topic :: Scientific/Engineering :: Physics',
        'Topic :: Scientific/Engineering :: Chemistry',
]

[project.urls]
Homepage = "https://github.com/diffractionai/diffai.xrdreader/"
Issues = "https://github.com/diffractionai/diffai.xrdreader/issues/"

[project.optional-dependencies]
# Extra dependencies used ONLY by the Streamlit web UI (webapp.py) for CIF
# export (pymatgen) and Materials Project lookups (mp_api). They are NOT
# needed for the CLI pipeline. Install them with:
#     pip install ".[webapp]"
webapp = [
    "pymatgen",
    "mp_api",
]

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"
dev_template = "{tag}"
dirty_template = "{tag}"
# Derive the version ONLY from real version tags (e.g. 0.1.0). Without this,
# the most recent tag of ANY name is used, so a snapshot/backup tag like
# "pre-formatter" becomes the version and `pip install .` fails with
# InvalidVersion. If no version tag is reachable, the tool falls back to 0.0.1.
tag_filter = '^[0-9]+\.[0-9]+\.[0-9]+'

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools.package-data]
# report.py reads this template at runtime, so it has to be installed beside it.
"diffai.xrdreader" = ["report_template.html"]

[project.scripts]
diffai-xrdreader = "diffai.xrdreader.app:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/pip.txt"]}

[tool.codespell]
exclude-file = ".codespell/ignore_lines.txt"
ignore-words = ".codespell/ignore_words.txt"
skip = "*.cif,*.dat"

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.rst
  | \.txt
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
)/
'''
