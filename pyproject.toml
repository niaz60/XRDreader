[build-system]
requires = ["setuptools>=62.0", "setuptools-git-versioning>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffai.xrdreader"
dynamic=['version', 'dependencies']
authors = [
  {name='Afnan Mostafa', email='amostafa@ur.rochester.edu'},
  {name='Simon J. L. Billinge', email='sbillinge@ucsb.edu'},
  {name='Niaz Abdulrahman', email='niaz@rochester.edu'},
  {name='William Ratcliffe', email='wratclif@umd.edu'},
]
maintainers = [
  {name='Afnan Mostafa', email='amostafa@ur.rochester.edu'},
  {name='Simon J. L. Billinge', email='sbillinge@ucsb.edu'},
  {name='Niaz Abdulrahman', email='niaz@rochester.edu'},
  {name='William Ratcliffe', email='wratclif@umd.edu'},
]
description = "Multi-step agentic framework for extracting powder diffractio"
keywords = ['n patterns and associated metadata from published literature']
readme = "README.rst"
requires-python = ">=3.12, <3.15"
classifiers = [
        'Development Status :: 4 - Beta',
        'Environment :: X11 Applications :: Qt',
        'Intended Audience :: Developers',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: BSD License',
        'Operating System :: MacOS :: MacOS X',
        'Operating System :: Microsoft :: Windows',
        'Operating System :: POSIX',
        'Operating System :: Unix',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Topic :: Scientific/Engineering :: Physics',
        'Topic :: Scientific/Engineering :: Chemistry',
]

[project.urls]
Homepage = "https://github.com/diffractionai/diffai.xrdreader/"
Issues = "https://github.com/diffractionai/diffai.xrdreader/issues/"

[tool.setuptools-git-versioning]
enabled = true
template = "{tag}"
dev_template = "{tag}"
dirty_template = "{tag}"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[project.scripts]
diffai-xrdreader = "diffai.xrdreader.app:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/pip.txt"]}

[tool.codespell]
exclude-file = ".codespell/ignore_lines.txt"
ignore-words = ".codespell/ignore_words.txt"
skip = "*.cif,*.dat"

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72

[tool.black]
line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.rst
  | \.txt
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
)/
'''
