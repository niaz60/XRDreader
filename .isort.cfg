[settings]
# Keep import statement below line_length character limit
line_length = 79
multi_line_output = 3
include_trailing_comma = True
# Wrap long imports with parentheses (not backslashes) so isort's output
# matches black's -- without this the two tools reformat imports differently
# and undo each other on every run. (Equivalent to isort's profile = black.)
use_parentheses = True
